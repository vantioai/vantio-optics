packages:
  - 'packages/vantio-agent-sdk'
  - 'packages/vantio-cli'
  - 'packages/vantio-optics-mcp'

# hono before 4.13.16 and @hono/node-server before 2.1.6 have open
# advisories (GHSA-46wx-v44x-9hh2, GHSA-4h7h-rv7c-7m2v, GHSA-4m76-xfj5-7975,
# GHSA-h7mg-cq63-vhpq, GHSA-3gg2-335m-rxc6, GHSA-rmxm-3fg6-px4f,
# GHSA-jpvv-r467-5p4w, GHSA-qv5m-9pm6-hqp3 and older). Both reach
# @vantio/optics-mcp through @modelcontextprotocol/sdk, so Dependabot cannot
# move them; these floors keep a lock refresh from going back (VAN-188,
# VAN-306). vantio-open-core #426 resolves @hono/node-server 2.1.9.
overrides:
  hono@<4.13.16: ^4.13.16
  '@hono/node-server@<2.1.6': ^2.1.6
  # body-parser before 2.4.0 (GHSA-27r3-jxmh-p828), fast-uri before 3.1.9
  # (GHSA-qw65-cvwx-89v3, GHSA-v2hh-gcrm-f6hx and 10 more), ip-address before
  # 10.7.4 (GHSA-mwp4-54f8-5fhr, GHSA-rxp7-6hxx-x8q5 and 6 more) and qs before
  # 6.16.1 (GHSA-6pq8-jhm2-2vcw, GHSA-4mjr-xmp4-gh2g, GHSA-x5fp-wj9c-mxmx)
  # reach @vantio/optics-mcp through @modelcontextprotocol/sdk. Only
  # body-parser was below its floor here; the other three keep a lock refresh
  # from going back. Same floors as vantio-open-core (VAN-308).
  body-parser@<2.4.0: ^2.4.0
  fast-uri@<3.1.9: ^3.1.9
  ip-address@<10.7.4: ^10.7.4
  qs@<6.16.1: ^6.16.1
